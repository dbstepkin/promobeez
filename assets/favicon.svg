<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFD84D"/>
      <stop offset="1" stop-color="#FF9E1B"/>
    </linearGradient>
    <clipPath id="clip">
      <rect x="20" y="22" width="24" height="36" rx="12"/>
    </clipPath>
  </defs>
  <!-- antennae -->
  <path d="M26 20 C23 14 19 11 16 12" stroke="#100D1A" stroke-width="3" stroke-linecap="round" fill="none"/>
  <path d="M38 20 C41 14 45 11 48 12" stroke="#100D1A" stroke-width="3" stroke-linecap="round" fill="none"/>
  <!-- antenna tips -->
  <circle cx="15" cy="11.5" r="3.5" fill="#FF5A3C"/>
  <circle cx="49" cy="11.5" r="3.5" fill="#FF5A3C"/>
  <!-- wings -->
  <ellipse cx="15" cy="32" rx="13" ry="9" fill="#fff" fill-opacity=".92" stroke="#100D1A" stroke-width="2.5"/>
  <ellipse cx="49" cy="32" rx="13" ry="9" fill="#fff" fill-opacity=".92" stroke="#100D1A" stroke-width="2.5"/>
  <!-- body -->
  <rect x="20" y="22" width="24" height="36" rx="12" fill="url(#body)" stroke="#100D1A" stroke-width="3"/>
  <!-- stripes -->
  <g clip-path="url(#clip)">
    <rect x="18" y="36" width="28" height="6" fill="#100D1A"/>
    <rect x="18" y="48" width="28" height="6" fill="#100D1A"/>
  </g>
</svg>

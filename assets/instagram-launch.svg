<svg width="1080" height="1080" viewBox="0 0 1080 1080" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFF6E9"/>
      <stop offset="0.5" stop-color="#FFF0F5"/>
      <stop offset="1" stop-color="#F3ECFF"/>
    </linearGradient>
    <linearGradient id="beeBody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFD84D"/>
      <stop offset="1" stop-color="#FF9E1B"/>
    </linearGradient>
    <linearGradient id="coralGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FF5A3C"/>
      <stop offset="0.5" stop-color="#FF6FB5"/>
      <stop offset="1" stop-color="#7C3AED"/>
    </linearGradient>
    <linearGradient id="pill1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FF5A3C"/>
      <stop offset="1" stop-color="#FF8A3D"/>
    </linearGradient>
    <linearGradient id="pill2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7C3AED"/>
      <stop offset="1" stop-color="#A78BFA"/>
    </linearGradient>
    <filter id="blur1"><feGaussianBlur stdDeviation="90"/></filter>
    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#100D1A" flood-opacity="0.14"/>
    </filter>
    <clipPath id="bclip">
      <rect x="497" y="212" width="86" height="132" rx="43"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect width="1080" height="1080" fill="url(#bg)"/>

  <!-- Mesh blobs -->
  <circle cx="120" cy="180" r="300" fill="#FF5A3C" opacity=".22" filter="url(#blur1)"/>
  <circle cx="980" cy="140" r="260" fill="#FFD84D" opacity=".28" filter="url(#blur1)"/>
  <circle cx="960" cy="920" r="300" fill="#A78BFA" opacity=".24" filter="url(#blur1)"/>
  <circle cx="140" cy="960" r="260" fill="#FF6FB5" opacity=".2" filter="url(#blur1)"/>

  <!-- Dot grid -->
  <pattern id="dots" x="0" y="0" width="34" height="34" patternUnits="userSpaceOnUse">
    <circle cx="1.5" cy="1.5" r="1.5" fill="#100D1A" opacity=".07"/>
  </pattern>
  <rect width="1080" height="1080" fill="url(#dots)"/>

  <!-- Top badge -->
  <g filter="url(#softShadow)">
    <rect x="366" y="72" width="348" height="66" rx="33" fill="#100D1A"/>
  </g>
  <circle cx="416" cy="105" r="8" fill="#2DD4A7"/>
  <text x="446" y="114" font-family="'General Sans','Helvetica Neue',Arial,sans-serif"
        font-size="24" font-weight="600" fill="#fff" letter-spacing="1">NOW IN HELSINKI</text>

  <!-- BEE MARK -->
  <g transform="translate(0,52)">
    <path d="M513 208 C503 176 486 165 471 169" stroke="#100D1A" stroke-width="10" stroke-linecap="round" fill="none"/>
    <path d="M567 208 C577 176 594 165 609 169" stroke="#100D1A" stroke-width="10" stroke-linecap="round" fill="none"/>
    <circle cx="467" cy="167" r="14" fill="#FF5A3C"/>
    <circle cx="613" cy="167" r="14" fill="#FF5A3C"/>
    <ellipse cx="470" cy="278" rx="54" ry="35" fill="#fff" fill-opacity=".92" stroke="#100D1A" stroke-width="9" transform="rotate(-14 470 278)"/>
    <ellipse cx="610" cy="278" rx="54" ry="35" fill="#fff" fill-opacity=".92" stroke="#100D1A" stroke-width="9" transform="rotate(14 610 278)"/>
    <rect x="497" y="212" width="86" height="132" rx="43" fill="url(#beeBody)" stroke="#100D1A" stroke-width="10"/>
    <g clip-path="url(#bclip)">
      <rect x="493" y="266" width="94" height="20" fill="#100D1A"/>
      <rect x="493" y="302" width="94" height="20" fill="#100D1A"/>
    </g>
  </g>

  <!-- Wordmark -->
  <text x="540" y="430" text-anchor="middle" font-family="'Clash Display','Helvetica Neue',Arial,sans-serif"
        font-size="76" font-weight="700" letter-spacing="-2" fill="#100D1A">Promo<tspan fill="#FF9E1B">beez</tspan></text>

  <!-- Headline -->
  <text x="540" y="562" text-anchor="middle" font-family="'Clash Display','Helvetica Neue',Arial,sans-serif"
        font-size="92" font-weight="700" letter-spacing="-1" fill="#100D1A">Local brands meet</text>
  <text x="540" y="666" text-anchor="middle" font-family="'Clash Display','Helvetica Neue',Arial,sans-serif"
        font-size="92" font-weight="700" letter-spacing="-1" fill="url(#coralGrad)">real creators</text>

  <!-- Hand-drawn underline -->
  <path d="M300 690 C 460 674, 620 674, 780 686" stroke="#FFC93C" stroke-width="12" stroke-linecap="round" fill="none"/>

  <!-- Subtitle -->
  <text x="540" y="756" text-anchor="middle" font-family="'General Sans','Helvetica Neue',Arial,sans-serif"
        font-size="34" font-weight="500" fill="#4A4460">No cash. No commissions. Just barter.</text>

  <!-- Two audience pills -->
  <g filter="url(#softShadow)">
    <rect x="196" y="828" width="320" height="96" rx="26" fill="url(#pill1)"/>
  </g>
  <text x="356" y="874" text-anchor="middle" font-family="'General Sans','Helvetica Neue',Arial,sans-serif"
        font-size="30" font-weight="700" fill="#fff">🏪  For businesses</text>
  <text x="356" y="906" text-anchor="middle" font-family="'General Sans','Helvetica Neue',Arial,sans-serif"
        font-size="19" font-weight="500" fill="rgba(255,255,255,.85)">Reach local audiences</text>

  <g filter="url(#softShadow)">
    <rect x="564" y="828" width="320" height="96" rx="26" fill="url(#pill2)"/>
  </g>
  <text x="724" y="874" text-anchor="middle" font-family="'General Sans','Helvetica Neue',Arial,sans-serif"
        font-size="30" font-weight="700" fill="#fff">📸  For creators</text>
  <text x="724" y="906" text-anchor="middle" font-family="'General Sans','Helvetica Neue',Arial,sans-serif"
        font-size="19" font-weight="500" fill="rgba(255,255,255,.85)">From 500 followers</text>

  <!-- CTA -->
  <text x="540" y="1006" text-anchor="middle" font-family="'General Sans','Helvetica Neue',Arial,sans-serif"
        font-size="28" font-weight="600" fill="#100D1A">Join the waitlist  →  promobeez.com</text>
</svg>
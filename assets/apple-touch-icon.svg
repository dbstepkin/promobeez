<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 180">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFBF0"/>
      <stop offset="1" stop-color="#FFF3D0"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFD84D"/>
      <stop offset="1" stop-color="#FF9E1B"/>
    </linearGradient>
    <clipPath id="clip">
      <rect x="66" y="72" width="48" height="72" rx="24"/>
    </clipPath>
    <clipPath id="rounded">
      <rect width="180" height="180" rx="40"/>
    </clipPath>
  </defs>
  <!-- background rounded square (iOS icon shape) -->
  <rect width="180" height="180" rx="40" fill="url(#bg)"/>
  <!-- antennae -->
  <path d="M78 66 C70 44 59 38 50 40" stroke="#100D1A" stroke-width="6.5" stroke-linecap="round" fill="none"/>
  <path d="M102 66 C110 44 121 38 130 40" stroke="#100D1A" stroke-width="6.5" stroke-linecap="round" fill="none"/>
  <!-- tips -->
  <circle cx="47" cy="38" r="9" fill="#FF5A3C"/>
  <circle cx="133" cy="38" r="9" fill="#FF5A3C"/>
  <!-- wings -->
  <ellipse cx="50" cy="96" rx="34" ry="22" fill="#fff" fill-opacity=".96" stroke="#100D1A" stroke-width="6"/>
  <ellipse cx="130" cy="96" rx="34" ry="22" fill="#fff" fill-opacity=".96" stroke="#100D1A" stroke-width="6"/>
  <!-- body -->
  <rect x="66" y="72" width="48" height="72" rx="24" fill="url(#body)" stroke="#100D1A" stroke-width="7"/>
  <!-- stripes -->
  <g clip-path="url(#clip)">
    <rect x="62" y="108" width="56" height="13" fill="#100D1A"/>
    <rect x="62" y="132" width="56" height="13" fill="#100D1A"/>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 628" width="1200" height="628">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#100D1A"/>
      <stop offset="1" stop-color="#1E1730"/>
    </linearGradient>
    <linearGradient id="beeBody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFD84D"/>
      <stop offset="1" stop-color="#FF9E1B"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="60"/>
    </filter>
    <clipPath id="bclip2">
      <rect x="84" y="222" width="72" height="108" rx="36"/>
    </clipPath>
  </defs>

  <!-- Dark background -->
  <rect width="1200" height="628" fill="url(#bg)"/>

  <!-- Color blobs -->
  <circle cx="160" cy="200" r="260" fill="#FF5A3C" opacity=".22" filter="url(#glow)"/>
  <circle cx="1080" cy="440" r="240" fill="#A78BFA" opacity=".2" filter="url(#glow)"/>
  <circle cx="650" cy="620" r="200" fill="#FFD84D" opacity=".12" filter="url(#glow)"/>

  <!-- BEE small -->
  <path d="M95 212 C80 178 62 168 48 172" stroke="#fff" stroke-width="8" stroke-linecap="round" fill="none"/>
  <path d="M129 212 C144 178 162 168 176 172" stroke="#fff" stroke-width="8" stroke-linecap="round" fill="none"/>
  <circle cx="43" cy="170" r="11" fill="#FF5A3C"/>
  <circle cx="181" cy="170" r="11" fill="#FF5A3C"/>
  <ellipse cx="47" cy="278" rx="46" ry="30" fill="#fff" fill-opacity=".15" stroke="#fff" stroke-opacity=".4" stroke-width="7"/>
  <ellipse cx="193" cy="278" rx="46" ry="30" fill="#fff" fill-opacity=".15" stroke="#fff" stroke-opacity=".4" stroke-width="7"/>
  <rect x="84" y="222" width="72" height="108" rx="36" fill="url(#beeBody)" stroke="#100D1A" stroke-width="8"/>
  <g clip-path="url(#bclip2)">
    <rect x="80" y="264" width="80" height="18" fill="#100D1A"/>
    <rect x="80" y="296" width="80" height="18" fill="#100D1A"/>
  </g>

  <!-- Wordmark -->
  <text x="280" y="308" font-family="'Clash Display','Helvetica Neue',Arial,sans-serif"
        font-size="96" font-weight="700" letter-spacing="-3" fill="#fff">Promo</text>
  <text x="720" y="308" font-family="'Clash Display','Helvetica Neue',Arial,sans-serif"
        font-size="96" font-weight="700" letter-spacing="-3" fill="#FF9E1B">beez</text>

  <!-- Tagline -->
  <text x="280" y="368" font-family="'General Sans','Helvetica Neue',Arial,sans-serif"
        font-size="26" font-weight="500" fill="rgba(255,255,255,.6)">Local creators × local brands — no cash, just barter</text>

  <!-- 3 stat pills -->
  <rect x="280" y="404" width="170" height="48" rx="24" fill="rgba(255,255,255,.08)" stroke="rgba(255,255,255,.14)" stroke-width="1.5"/>
  <text x="365" y="434" font-family="'General Sans','Helvetica Neue',Arial,sans-serif"
        font-size="18" font-weight="600" fill="#FFD84D" text-anchor="middle">500+ followers</text>

  <rect x="464" y="404" width="148" height="48" rx="24" fill="rgba(255,255,255,.08)" stroke="rgba(255,255,255,.14)" stroke-width="1.5"/>
  <text x="538" y="434" font-family="'General Sans','Helvetica Neue',Arial,sans-serif"
        font-size="18" font-weight="600" fill="#FF6FB5" text-anchor="middle">0% fees</text>

  <rect x="626" y="404" width="200" height="48" rx="24" fill="rgba(255,255,255,.08)" stroke="rgba(255,255,255,.14)" stroke-width="1.5"/>
  <text x="726" y="434" font-family="'General Sans','Helvetica Neue',Arial,sans-serif"
        font-size="18" font-weight="600" fill="#4ADE80" text-anchor="middle">Geo-verified</text>

  <!-- Domain -->
  <text x="280" y="510" font-family="'General Sans','Helvetica Neue',Arial,sans-serif"
        font-size="20" font-weight="500" fill="rgba(255,255,255,.3)">promobeez.com</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 628" width="1200" height="628">
  <defs>
    <linearGradient id="hero" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FDF9F3"/>
      <stop offset="1" stop-color="#FFF5EE"/>
    </linearGradient>
    <linearGradient id="beeBody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFD84D"/>
      <stop offset="1" stop-color="#FF9E1B"/>
    </linearGradient>
    <clipPath id="bclip">
      <rect x="306" y="214" width="72" height="108" rx="36"/>
    </clipPath>
    <filter id="blur1">
      <feGaussianBlur stdDeviation="70"/>
    </filter>
    <filter id="blur2">
      <feGaussianBlur stdDeviation="55"/>
    </filter>
  </defs>

  <rect width="1200" height="628" fill="url(#hero)"/>

  <circle cx="180" cy="140" r="280" fill="#FF5A3C" opacity=".14" filter="url(#blur1)"/>
  <circle cx="1020" cy="120" r="260" fill="#FFD84D" opacity=".18" filter="url(#blur2)"/>
  <circle cx="320" cy="540" r="220" fill="#A78BFA" opacity=".12" filter="url(#blur1)"/>
  <circle cx="900" cy="520" r="240" fill="#FF6FB5" opacity=".10" filter="url(#blur2)"/>

  <pattern id="dots" x="0" y="0" width="32" height="32" patternUnits="userSpaceOnUse">
    <circle cx="1" cy="1" r="1.2" fill="#100D1A" opacity=".06"/>
  </pattern>
  <rect width="1200" height="628" fill="url(#dots)"/>

  <!-- Centered logo row -->
  <g transform="translate(48, 0)">
    <path d="M317 204 C302 170 284 160 270 164" stroke="#100D1A" stroke-width="8" stroke-linecap="round" fill="none"/>
    <path d="M351 204 C366 170 384 160 398 164" stroke="#100D1A" stroke-width="8" stroke-linecap="round" fill="none"/>
    <circle cx="265" cy="162" r="11" fill="#FF5A3C"/>
    <circle cx="403" cy="162" r="11" fill="#FF5A3C"/>
    <ellipse cx="269" cy="270" rx="46" ry="30" fill="#fff" fill-opacity=".95" stroke="#100D1A" stroke-width="7"/>
    <ellipse cx="415" cy="270" rx="46" ry="30" fill="#fff" fill-opacity=".95" stroke="#100D1A" stroke-width="7"/>
    <rect x="306" y="214" width="72" height="108" rx="36" fill="url(#beeBody)" stroke="#100D1A" stroke-width="8"/>
    <g clip-path="url(#bclip)">
      <rect x="302" y="256" width="80" height="18" fill="#100D1A"/>
      <rect x="302" y="288" width="80" height="18" fill="#100D1A"/>
    </g>
    <text x="535" y="300" font-family="'Clash Display','Helvetica Neue',Arial,sans-serif"
          font-size="92" font-weight="700" letter-spacing="-1" fill="#100D1A">Promo<tspan fill="#FF9E1B">beez</tspan></text>
  </g>

  <text x="600" y="368" font-family="'General Sans','Helvetica Neue',Arial,sans-serif"
        font-size="26" font-weight="500" fill="#7A7486" text-anchor="middle">Local creators × local brands — no cash, just barter</text>

  <rect x="331" y="396" width="185" height="48" rx="24" fill="#FFF8E8" stroke="#FFE4A8" stroke-width="1.5"/>
  <text x="423" y="426" font-family="'General Sans','Helvetica Neue',Arial,sans-serif"
        font-size="18" font-weight="600" fill="#D97706" text-anchor="middle">500+ followers</text>

  <rect x="530" y="396" width="130" height="48" rx="24" fill="#FFF0F6" stroke="#FFC8E0" stroke-width="1.5"/>
  <text x="595" y="426" font-family="'General Sans','Helvetica Neue',Arial,sans-serif"
        font-size="18" font-weight="600" fill="#DB2777" text-anchor="middle">0% fees</text>

  <rect x="674" y="396" width="195" height="48" rx="24" fill="#EDFDF7" stroke="#BBEDD9" stroke-width="1.5"/>
  <text x="771" y="426" font-family="'General Sans','Helvetica Neue',Arial,sans-serif"
        font-size="18" font-weight="600" fill="#0D9B6C" text-anchor="middle">Geo-verified</text>

  <text x="600" y="510" font-family="'General Sans','Helvetica Neue',Arial,sans-serif"
        font-size="20" font-weight="500" fill="#7A7486" text-anchor="middle">promobeez.com</text>
</svg>
